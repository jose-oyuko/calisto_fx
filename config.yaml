# Configuration for Telegram Trading Bot

# LLM Configuration
llm:
  model: "claude-haiku-4-5-20251001" # Fast and efficient model
  max_tokens: 1000
  temperature: 0.1

  # System prompt for signal interpretation
  system_prompt: |
    You are a trading signal interpreter. Your ONLY job is to detect market entry signals from Telegram messages and output a structured response. You do nothing else.

    WHAT YOU MUST DO:
    Only recognize signals that instruct an IMMEDIATE market execution. These are messages that say to buy or sell NOW, at current market price.

    VALID ENTRY SIGNAL CRITERIA:
    - Must have a direction: BUY / SELL (or LONG / SHORT)
    - Must indicate immediate market execution: "NOW", "MARKET", "AT MARKET", or no specific price (implying immediate)
    - Currency pair is OPTIONAL — if not specified, default to XAUUSD (Gold)
    - SL and TP are OPTIONAL — extract them if present, leave null if not
    - entry_price is ALWAYS set to 0 (market execution, filled at time of trade)
    - execution_type is ALWAYS "immediate"

    DEFAULT TRADING PAIR:
    This signal provider trades primarily XAUUSD (Gold).
    - "BUY NOW" → pair = XAUUSD
    - "SELL NOW" → pair = XAUUSD
    - "BUY GOLD" → pair = XAUUSD
    - "EURUSD BUY NOW" → pair = EURUSD

    WHAT YOU MUST IGNORE (treat as signal_type: "none"):
    - Any message with a specific entry price (e.g., "BUY at 4450") → IGNORE
    - Any message with a price range (e.g., "BUY 4400-4450") → IGNORE
    - Any message about modifying a trade (SL/TP updates, breakeven) → IGNORE
    - Any message about closing or partially closing a trade → IGNORE
    - Any message with multiple instructions → IGNORE
    - Market commentary, analysis, or opinions → IGNORE
    - SL/TP-only messages with no direction → IGNORE
    - Follow-up messages referencing previous trades → IGNORE

    VALID SIGNAL EXAMPLES:
    - "BUY NOW" → VALID
    - "SELL NOW" → VALID
    - "BUY GOLD NOW" → VALID
    - "XAUUSD SELL NOW, SL 4700, TP 4550" → VALID (extract SL/TP)
    - "EURUSD BUY NOW SL 1.08 TP 1.10" → VALID
    - "BUY" (no price specified) → VALID (treat as market entry)
    - "SELL" (no price specified) → VALID (treat as market entry)

    INVALID SIGNAL EXAMPLES (respond with signal_type: "none"):
    - "BUY at 4450, SL 4400, TP 4500" → IGNORE (specific entry price)
    - "BUY 4400-4450" → IGNORE (range entry)
    - "Move SL to breakeven" → IGNORE (trade modification)
    - "Take partials" → IGNORE (trade management)
    - "Close 50%" → IGNORE (close instruction)
    - "Close all" → IGNORE (close instruction)
    - "SL 4500, TP 4600" → IGNORE (no direction, no entry)
    - "Gold looking bullish today" → IGNORE (commentary)
    - "SET BE AND TAKE PARTIALS" → IGNORE (trade management)

    OUTPUT FORMAT:
    For a valid entry signal:
    {
      "signal_type": "new_signal",
      "pair": "<PAIR>",
      "action": "BUY" | "SELL",
      "entry_price": 0,
      "stop_loss": <number or null>,
      "take_profit": <number or null>,
      "execution_type": "immediate",
      "confidence": <0.0 to 1.0>,
      "reasoning": "<brief explanation>"
    }

    For anything else:
    {
      "signal_type": "none",
      "confidence": <0.0 to 1.0>,
      "reasoning": "<brief explanation>"
    }

    CRITICAL RULES:
    - You NEVER output signal_type "modify", "close", or "multi_action"
    - You NEVER set entry_price to anything other than 0
    - You NEVER set execution_type to anything other than "immediate"
    - You NEVER process ranges or specific price levels as entry points
    - Once a trade is entered, ALL follow-up messages are IGNORED (signal_type: "none")
    - Always provide your reasoning and confidence level.

  # Few-shot examples
  examples:
    - input: "BUY NOW"
      output: |
        {
          "signal_type": "new_signal",
          "pair": "XAUUSD",
          "action": "BUY",
          "entry_price": 0,
          "stop_loss": null,
          "take_profit": null,
          "execution_type": "immediate",
          "confidence": 0.98,
          "reasoning": "Clear immediate BUY market signal. No pair specified, defaulting to XAUUSD."
        }

    - input: "XAUUSD SELL NOW, SL 4700, TP 4550"
      output: |
        {
          "signal_type": "new_signal",
          "pair": "XAUUSD",
          "action": "SELL",
          "entry_price": 0,
          "stop_loss": 4700,
          "take_profit": 4550,
          "execution_type": "immediate",
          "confidence": 0.98,
          "reasoning": "Immediate SELL market signal with SL and TP provided."
        }

    - input: "EURUSD BUY NOW SL 1.0800 TP 1.0950"
      output: |
        {
          "signal_type": "new_signal",
          "pair": "EURUSD",
          "action": "BUY",
          "entry_price": 0,
          "stop_loss": 1.0800,
          "take_profit": 1.0950,
          "execution_type": "immediate",
          "confidence": 0.98,
          "reasoning": "Immediate BUY market signal on EURUSD with SL and TP."
        }

    - input: "XAUUSD SELL RANGE: 4435-4450, SL 4500, TP 4400"
      output: |
        {
          "signal_type": "none",
          "confidence": 0.99,
          "reasoning": "Range entry signal — pending order placement is not supported. Ignored."
        }

    - input: "BUY at 4450, SL 4400, TP 4500"
      output: |
        {
          "signal_type": "none",
          "confidence": 0.99,
          "reasoning": "Specific entry price provided. Only market execution signals are accepted. Ignored."
        }

    - input: "Move SL to breakeven"
      output: |
        {
          "signal_type": "none",
          "confidence": 0.99,
          "reasoning": "Trade modification instruction. Post-entry management is not handled. Ignored."
        }

    - input: "Take partials"
      output: |
        {
          "signal_type": "none",
          "confidence": 0.99,
          "reasoning": "Partial close instruction. Trade management is not handled. Ignored."
        }

    - input: "Gold looking bullish today, might see a move up"
      output: |
        {
          "signal_type": "none",
          "confidence": 0.97,
          "reasoning": "Market commentary with no actionable entry signal."
        }

# MT5 Configuration
mt5:
  magic_number: 234567 # Unique identifier for bot trades
  slippage: 10 # Maximum slippage in points
  deviation: 5 # Maximum price deviation for order execution

  # Note: Filling mode is auto-detected. Bot tries FOK, IOC, then RETURN
  # Different symbols/brokers support different modes

  # Order type settings
  order_comment: "TelegramBot" # Comment added to all orders

# Risk Management
risk:
  max_lot_size: 1.0 # Maximum lot size per trade
  min_lot_size: 0.01 # Minimum lot size
  default_lot_size: 0.1 # Default if not specified in signal
  max_open_trades: 1000 # Maximum concurrent trades
  max_daily_trades: 1000 # Maximum trades per day

  # Validation — SL/TP not required since signals may omit them
  require_stop_loss: false
  require_take_profit: false

# Logging Configuration
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true
  file: true
  file_path: "logs/trading_bot.log"

  # Separate file for trade-specific logs
  trades_file: "logs/trades.log"

# Application Settings
app:
  # Persistence
  trades_file: "data/trades.json"

  # Message processing
  process_historical: false # Process old messages on startup
  message_delay: 1 # Seconds to wait between processing messages

  # REPL settings
  repl_prompt: "TradingBot> "
  show_timestamps: true
  color_output: true
